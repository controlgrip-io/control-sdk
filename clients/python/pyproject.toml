[project]
name = "controlgrip-client"
version = "0.1.0"
description = "ControlGrip orchestrator API client (session-cookie auth)"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/controlgrip_client"]
