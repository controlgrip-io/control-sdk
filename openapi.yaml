openapi: 3.1.0
info:
  title: ControlGrip Orchestrator API (session-scoped)
  version: 0.2.0
  description: >
    The console's own API: cookie-session authenticated (better-auth sign-in on
    the auth edge), org-scoped. Reads require org membership; mutations require
    an org owner/admin. No API tokens yet. Worker-plane endpoints
    (/api/worker/*) are HMAC bearer-token authenticated and NOT covered here.
servers:
  # Both planes are served from ONE origin only via the client nginx (dev host
  # port 60000) or production; :30000 is the auth edge alone (domain API is on
  # :40000), so a single-base-URL client must use the nginx/production origin.
  - url: https://www.controlgrip.io
paths:
  /api/auth/sign-in/email:
    post:
      summary: Sign in (auth edge); sets the session cookie
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties: { email: {type: string}, password: {type: string} }
      responses: { "200": { description: Session cookie set } }
  /api/projects:
    get: { summary: List projects, responses: { "200": { description: OK } } }
    post:
      summary: Create project (admin)
      requestBody: { content: { application/json: { schema: { type: object, required: [name], properties: { name: {type: string} } } } } }
      responses: { "200": { description: Created } }
  /api/connectors:
    get: { summary: List connectors, responses: { "200": { description: OK } } }
    post:
      summary: Create connector (admin)
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateConnector' }
      responses: { "200": { description: Created } }
  /api/connectors/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put: { summary: Update connector (admin), responses: { "200": { description: OK } } }
    delete: { summary: Delete connector (admin), responses: { "200": { description: OK } } }
  /api/jobs:
    get: { summary: List jobs, responses: { "200": { description: OK } } }
    post:
      summary: Create job with tasks (admin)
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateJob' }
      responses: { "200": { description: Created } }
  /api/jobs/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get: { summary: Job detail (latest version tasks + schedules), responses: { "200": { description: OK } } }
  /api/jobs/{id}/tasks:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      summary: Publish a new task set as a new job version (admin)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [tasks]
              properties:
                base_version: { type: integer, description: Optimistic-concurrency guard }
                tasks: { type: array, items: { $ref: '#/components/schemas/JobTask' } }
      responses: { "200": { description: New version } }
  /api/jobs/{id}/secrets:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get: { summary: List secret names+versions (never values), responses: { "200": { description: OK } } }
    put:
      summary: Set per-job secrets (admin; write-only)
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [secrets], properties: { secrets: { type: object, additionalProperties: { type: string } } } }
      responses: { "200": { description: OK } }
  /api/jobs/{id}/variables:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get: { summary: List variables, responses: { "200": { description: OK } } }
    put:
      summary: Set non-secret variables (admin)
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [variables], properties: { variables: { type: object, additionalProperties: { type: string } } } }
      responses: { "200": { description: OK } }
  /api/jobs/{id}/run:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post: { summary: Trigger a manual run (admin), responses: { "200": { description: "{job_run_id}" } } }
  /api/schedules:
    post:
      summary: Attach a cron schedule to an existing job (admin)
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [job_id, cron], properties: { job_id: {type: string}, cron: {type: string}, timezone: {type: string} } }
      responses: { "200": { description: Created } }
  /api/runs:
    get:
      summary: Newest 100 runs (org-wide, or filtered)
      parameters:
        - { name: job_id, in: query, schema: { type: string } }
        - { name: worker_id, in: query, schema: { type: string } }
        - { name: latest_per_job, in: query, schema: { type: string, enum: ["true"] } }
      responses: { "200": { description: OK } }
  /api/runs/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get: { summary: "Run detail (task_runs, validation_results, logs)", responses: { "200": { description: OK } } }
  /api/runs/{id}/cancel:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post: { summary: Cancel a run (admin), responses: { "200": { description: OK } } }
  /api/workers:
    get: { summary: List workers (with trust/version surface), responses: { "200": { description: OK } } }
    post:
      summary: Create worker row (admin) — response carries the ONE-TIME enrollmentKey
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: {type: string}, host: {type: string}, autoShutdownOnRemoval: {type: boolean} } }
      responses: { "200": { description: "{worker, enrollmentKey}" } }
  /api/pools:
    get: { summary: List pools with members, responses: { "200": { description: OK } } }
    post:
      summary: Create pool (admin; requires >= 1 enrolled worker to be useful)
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: {type: string}, timezone: {type: string} } }
      responses: { "200": { description: Created } }
  /api/pools/{poolId}/workers:
    parameters:
      - { name: poolId, in: path, required: true, schema: { type: string } }
    post:
      summary: Add worker to pool (admin)
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [worker_id], properties: { worker_id: {type: string} } }
      responses: { "200": { description: OK } }
  /api/integrations/github/status:
    get:
      operationId: getGitHubIntegrationStatus
      summary: Get the organization's GitHub App connection status
      responses:
        "200":
          description: GitHub integration configuration and connection status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitHubIntegrationStatus' }
  /api/integrations/github/connect:
    post:
      operationId: connectGitHub
      summary: Start GitHub OAuth and App installation (admin)
      description: >
        Returns a GitHub authorization URL. Open it in a browser; GitHub
        completes the OAuth and installation flow through the callback
        endpoint. This operation cannot complete the user-consent step
        headlessly.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                returnTo:
                  type: string
                  default: /settings/integrations
                  description: Relative ControlGrip path used after the callback
      responses:
        "200":
          description: Browser authorization URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitHubConnectResponse' }
  /api/integrations/github/callback:
    get:
      operationId: completeGitHubConnection
      summary: Complete GitHub OAuth or App installation callback
      description: >
        Browser callback used by GitHub. Signed, single-use state binds this
        unauthenticated request to the initiating ControlGrip organization and
        user; API clients should not call it directly.
      parameters:
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: code, in: query, schema: { type: string } }
        - { name: installation_id, in: query, schema: { type: integer, format: int64 } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "302": { description: Redirect to the App installation page or the requested ControlGrip return path }
  /api/integrations/github/repositories:
    get:
      operationId: listGitHubRepositories
      summary: List repositories granted to the organization
      description: >
        Returns the repository grant captured during connection, scoped to the
        intersection of the App installation and the connecting user's access.
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Case-insensitive substring filter on fullName }
      responses:
        "200":
          description: Granted repositories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GitHubRepository' }
  /api/integrations/github/branches:
    get:
      operationId: listGitHubBranches
      summary: List branches for a granted repository
      parameters:
        - { name: owner, in: query, required: true, schema: { type: string } }
        - { name: repo, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Repository branches
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GitHubBranch' }
  /api/integrations/github/repo-file:
    get:
      operationId: getGitHubRepositoryFileExists
      summary: Check whether a file exists at a repository ref
      parameters:
        - { name: owner, in: query, required: true, schema: { type: string } }
        - { name: repo, in: query, required: true, schema: { type: string } }
        - { name: ref, in: query, schema: { type: string }, description: Defaults to the repository's default branch }
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: File existence result
          content:
            application/json:
              schema:
                type: object
                required: [exists]
                properties: { exists: { type: boolean } }
  /api/integrations/github:
    delete:
      operationId: disconnectGitHub
      summary: Disconnect the organization's GitHub App installation (admin)
      description: >
        Fails with GITHUB_IN_USE while a current connector, latest job task, or
        active run still depends on the installation.
      responses:
        "204": { description: Disconnected }
        "409": { description: GitHub installation is still in use }
components:
  schemas:
    CreateConnector:
      type: object
      required: [name, type, config]
      properties:
        name: { type: string }
        type: { type: string, enum: [postgres, airbyte, controlgrip-python, controlgrip-typescript, controlgrip-golang, controlgrip-rust] }
        config: { type: object, description: "postgres: {host,port,database,user,password,sslmode}; airbyte: {image,config,configured_catalog}; plugins: {entrypoint,env,source_path?}" }
        source: { type: object, description: Uploaded plugin archive (folder upload custody) }
    JobTask:
      type: object
      required: [key, action, position]
      properties:
        key: { type: string }
        name: { type: string }
        position: { type: integer }
        connector_ref: { type: string, description: Connector id }
        action: { type: string, enum: [read, execute] }
        input: { type: object, description: "read: the connector's config JSON; execute: {sql}. ${var:NAME}/${secret:NAME} resolved at dispatch" }
        expected_output:
          type: object
          description: Deterministic validation contract
          properties:
            checks:
              type: array
              items:
                type: object
                required: [type]
                properties:
                  type: { type: string, enum: [record_count, stream_record_count, required_streams, fields_present, field_aggregate] }
        retry_policy: { type: object }
        source:
          $ref: '#/components/schemas/GitHubSource'
        depends_on:
          type: array
          items:
            type: object
            required: [task, when]
            properties:
              task: { type: string }
              when: { type: string, enum: [passes, finishes, starts] }
    CreateJob:
      type: object
      required: [name, tasks]
      properties:
        name: { type: string }
        project_id: { type: string }
        project_name: { type: string, description: Created on first use }
        pool_id: { type: string }
        variables: { type: object, additionalProperties: { type: string } }
        tasks: { type: array, items: { $ref: '#/components/schemas/JobTask' } }
        schedule:
          type: object
          required: [cron]
          properties: { cron: {type: string}, timezone: {type: string} }
    GitHubIntegrationStatus:
      type: object
      required: [connected, configured, mode]
      properties:
        connected: { type: boolean }
        configured: { type: boolean }
        mode: { type: string, enum: [app, none] }
        login: { type: string }
        avatarUrl: { type: string, format: uri }
        profileUrl: { type: string, format: uri }
    GitHubConnectResponse:
      type: object
      required: [authUrl]
      properties:
        authUrl: { type: string, format: uri }
    GitHubRepository:
      type: object
      required: [id, name, fullName, owner, defaultBranch, private, htmlUrl]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        fullName: { type: string }
        owner: { type: string }
        defaultBranch: { type: string }
        private: { type: boolean }
        htmlUrl: { type: string, format: uri }
    GitHubBranch:
      type: object
      required: [name, commit]
      properties:
        name: { type: string }
        commit:
          type: object
          required: [sha]
          properties:
            sha: { type: string }
    GitHubRepositoryIdentity:
      type: object
      required: [id, owner, name]
      properties:
        id: { type: integer, format: int64 }
        owner: { type: string }
        name: { type: string }
    GitHubSource:
      type: object
      description: Immutable task-owned Git source metadata resolved independently for each run
      required: [type, provider, authentication, repository, ref, revision_policy, workdir, main_path]
      properties:
        type: { type: string, const: git }
        provider: { type: string, const: github }
        authentication: { type: string, enum: [github_app, public] }
        repository: { $ref: '#/components/schemas/GitHubRepositoryIdentity' }
        ref: { type: string }
        revision_policy: { type: string, enum: [track_ref, pin] }
        pinned_revision:
          type: string
          description: Full commit SHA returned for a pinned source
        workdir: { type: string, default: "." }
        main_path: { type: string }
